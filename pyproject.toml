[project]
name = "data-quality-pipeline"
version = "0.1.0"
description = "A simple data quality pipeline"
requires-python = ">=3.11"

dependencies = [
    "pandas==2.3.3",
]


[tool.pytest.ini_options]
pythonpath = [
    "src"
]

testpaths = [
    "tests"
]


[tool.ruff]
line-length = 88
target-version = "py311"